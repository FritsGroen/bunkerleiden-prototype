name: Add fortress telephone tech cards

on:
  push:
    paths:
      - '.tech-fortress-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch techniek page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='festungsfernsprechter%20m38.jpg'
          if marker not in s:
              old='''<article class="techpanel" onclick="hes()"><img src="doorsnede%20technische%20tekening%20HES%201.2.png"><div class="inner"><div class="k">LUFTSCHUTZ</div><h3>HES 1.2 · ventilatie / overdruk</h3><p>Luchtbehandeling en overdruk, gekoppeld aan de huidige schakelruimte.</p><span class="badge">OPEN DOSSIER</span></div></article>'''
              new=old+'''<article class="techpanel" onclick="festungs38()"><img src="festungsfernsprechter%20m38.jpg"><div class="inner"><div class="k">FESTUNGSNACHRICHTEN</div><h3>Festungsfernsprecher 38 · bunkertelefoon</h3><p>Zwaar uitgevoerde OB-wandtelefoon voor vaste verdedigingswerken, in een waterdichte gietijzeren behuizing.</p><span class="badge">OPEN DOSSIER</span></div></article><article class="techpanel" onclick="kopf35()"><img src="kopff%20fernsprecher%2035.jpg"><div class="inner"><div class="k">BEDIENING & VERMITTLUNG</div><h3>Kopffernsprecher 35</h3><p>Headset met dubbele hoorschelpen en microfoon waarmee telefonisten en bemanningen handsfree konden spreken.</p><span class="badge">OPEN DOSSIER</span></div></article>'''
              s=s.replace(old,new)

          if 'function festungs38()' not in s:
              anchor='''function kev(){'''
              funcs=r'''function festungs38(){modal(`<div class='k'>TECHNISCH DOSSIER · FESTUNGSNACHRICHTEN</div><h2>FESTUNGSFERNSPRECHER 38</h2><div class='techdetail'><img src="festungsfernsprechter%20m38.jpg"><div><p class='copy'>De Festungsfernsprecher 38 was een vaste bunkertelefoon voor Duitse vesting- en verdedigingswerken. Het toestel werkte op OB-vermittelingen met inductoraanroep en was ondergebracht in een robuuste, waterdichte gietijzeren behuizing.</p><div class='techfacts'><div>TYPE</div><div>Festungsfernsprecher 38</div><div>NET</div><div>OB · Ortsbatterie</div><div>OPROEP</div><div>inductor / Kurbel</div><div>BEHUIZING</div><div>waterdicht gietijzer</div><div>BIJZONDERHEID</div><div>symmetrische schakeling en verbeterde isolatie tegen meeluisteren</div></div><p class='copy'>De microfoonstroom werd niet met een spreektoets onderbroken zoals bij de FF33, maar via de haakschakelaar wanneer de hoorn werd opgehangen.</p><a class='ghostbtn' href='https://www.der-fernmelder.de/nachrichtengeraet-in-festungen/festungsfernsprecher-38-festungsfernsprecher-d/' target='_blank' rel='noopener'>BRON · DER-FERNMELDER.DE →</a></div></div>`,true)}
function kopf35(){modal(`<div class='k'>TECHNISCH DOSSIER · BEDIENING</div><h2>KOPFFERNSPRECHER 35</h2><div class='techdetail'><img src="kopff%20fernsprecher%2035.jpg"><div><p class='copy'>De Kopffernsprecher 35 was bedoeld voor telefonisten en gevechtsbemanningen die moesten kunnen spreken zonder hun handen te gebruiken. De constructie met twee hoorschelpen en afsluitende rubberkussens verbeterde de verstaanbaarheid in luidruchtige ruimten.</p><div class='techfacts'><div>FUNCTIE</div><div>handsfree telefonie</div><div>OPBOUW</div><div>2 hoorschelpen, hoofdband, kinbeugel met microfoon</div><div>STEKKER</div><div>Heeresfünffachstecker</div><div>AANSLUITING</div><div>o.a. Festungsfernsprecher 38/D en vestingcentrales</div></div><p class='copy'>De microfoon zat op een draaibare houder: vóór de mond om te spreken, weggedraaid om hem uit te schakelen.</p><a class='ghostbtn' href='https://www.der-fernmelder.de/nachrichtengeraet-in-festungen/kopffernsprecher-35-40-und-43/' target='_blank' rel='noopener'>BRON · DER-FERNMELDER.DE →</a></div></div>`,true)}
'''
              s=s.replace(anchor,funcs+anchor)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "chatgpt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add Festungsfernsprecher 38 and Kopffernsprecher 35 dossiers" || exit 0
          git push
