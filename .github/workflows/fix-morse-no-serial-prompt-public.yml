name: Fix public Morse serial prompt

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_morse_no_serial_prompt_public.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Morse page
        run: python scripts/fix_morse_no_serial_prompt_public.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morse.html morse_BACKUP_2026-08-23_1302.html
          git diff --cached --quiet || git commit -m "Remove serial chooser from public Morse page"
          git push
