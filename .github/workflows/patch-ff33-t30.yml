name: Patch FF33 and T30 technique dossier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ff33-t30.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch FF33 and T30 dossier
        run: python scripts/patch_ff33_t30.py
      - name: Commit website update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index_BACKUP_2026-08-19_1104.html
          git commit -m "Add FF33 historical photos and T30 technique dossier"
          git push
