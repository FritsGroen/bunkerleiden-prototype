name: Fix Baumuster label
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-baumuster-label.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_baumuster_label.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morse.html
          git diff --cached --quiet && exit 0
          git commit -m "Correct remaining Baumuster label"
          git push
