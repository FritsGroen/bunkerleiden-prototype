name: Patch plan cursor zoom

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_plan_cursor_zoom.py'
      - '.github/workflows/patch-plan-cursor-zoom.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 tools/patch_plan_cursor_zoom.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Zoom plan viewer around cursor and pinch center"
          git push
