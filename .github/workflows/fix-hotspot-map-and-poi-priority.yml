name: Fix R616 hotspot map and POI priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hotspot-map-and-poi-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hotspot mapping and POI interaction
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('room-hotspot.js')
          s=p.read_text(encoding='utf-8')

          old_rooms="""  const ROOMS=[
    {id:'01',name:'SCHAKELRUIMTE',        x:.615,z:.350,w:.235,d:.225,h:.50,tech:'SCHAKELRUIMTE'},
    {id:'03',name:'GASSLUIS',             x:.700,z:.575,w:.115,d:.125,h:.44,tech:'GASSLUIS'},
    {id:'04',name:'NOODUITGANG',           x:.445,z:.465,w:.060,d:.095,h:.44,tech:'NOODUITGANG'},
    {id:'05',name:'NAHKAMPFRAUM',          x:.705,z:.715,w:.120,d:.175,h:.44,tech:'NAHKAMPFRAUM'},
    {id:'06',name:'ONDERHOUDSCORRIDOR',    x:.385,z:.555,w:.115,d:.355,h:.44,tech:'ONDERHOUD'},
    {id:'07',name:'TOEGANG NAAR TOBRUK',   x:.155,z:.720,w:.095,d:.145,h:.44,tech:'TOBRUK'},
    {id:'10',name:'HOOFDINGANG',           x:.555,z:.600,w:.165,d:.120,h:.44,tech:'HOOFDINGANG'}
  ];

  const POIS=[
    {id:'02',name:'HES',                    x:.620,z:.475,parent:'01',tech:'HES'},
    {id:'08',name:'WT80K',                  x:.755,z:.485,parent:'01',tech:'WT80K'},
    {id:'09',name:'KEV · VERBINDINGEN',     x:.535,z:.245,parent:'01',tech:'KEV'}
  ];"""
          new_rooms="""  const ROOMS=[
    /* Positions measured from the numbered historic plan, normalized to the full bunker footprint. */
    {id:'01',name:'SCHAKELRUIMTE',        x:.647,z:.342,w:.315,d:.245,h:.47,tech:'SCHAKELRUIMTE'},
    {id:'03',name:'GASSLUIS',             x:.738,z:.544,w:.135,d:.115,h:.44,tech:'GASSLUIS'},
    {id:'04',name:'NOODUITGANG',           x:.469,z:.432,w:.055,d:.080,h:.44,tech:'NOODUITGANG'},
    {id:'05',name:'NAHKAMPFRAUM',          x:.764,z:.722,w:.095,d:.145,h:.44,tech:'NAHKAMPFRAUM'},
    {id:'06',name:'ONDERHOUDSCORRIDOR',    x:.424,z:.490,w:.128,d:.490,h:.44,tech:'ONDERHOUD'},
    {id:'07',name:'TOEGANG NAAR TOBRUK',   x:.105,z:.700,w:.070,d:.120,h:.44,tech:'TOBRUK'},
    {id:'10',name:'HOOFDINGANG',           x:.561,z:.550,w:.150,d:.100,h:.44,tech:'HOOFDINGANG'}
  ];

  const POIS=[
    {id:'02',name:'HES',                    x:.652,z:.450,parent:'01',tech:'HES'},
    {id:'08',name:'WT80K',                  x:.786,z:.450,parent:'01',tech:'WT80K'},
    {id:'09',name:'KEV · VERBINDINGEN',     x:.517,z:.243,parent:'01',tech:'KEV'}
  ];"""
          if old_rooms not in s:
              raise SystemExit('ROOMS/POIS configuration not found')
          s=s.replace(old_rooms,new_rooms,1)

          old_world="""  function worldXZ(x,z){
    return {x:bbox.min.x+size.x*x,z:bbox.max.z-size.z*z};
  }"""
          new_world="""  function worldXZ(x,z){
    /* STL local X/Z are both reversed relative to the supplied plan/top-view orientation. */
    return {x:bbox.max.x-size.x*x,z:bbox.min.z+size.z*z};
  }"""
          if old_world not in s:
              raise SystemExit('worldXZ not found')
          s=s.replace(old_world,new_world,1)

          old_active="""  function activeFor(it){return !!(it.hover||it.labelHover||it.cardHover||selectedKey===it.key)}

  function refreshItem(it){"""
          new_active="""  function activeFor(it){
    const own=!!(it.hover||it.labelHover||it.cardHover||selectedKey===it.key);
    if(own)return true;
    /* Keep a room highlighted while one of its POIs is being inspected. */
    if(it.type==='room'){
      for(const child of items.values()){
        if(child.type!=='poi'||child.data.parent!==it.data.id)continue;
        if(child.hover||child.labelHover||child.cardHover||selectedKey===child.key)return true;
      }
    }
    return false;
  }

  function refreshItem(it){"""
          if old_active not in s:
              raise SystemExit('activeFor not found')
          s=s.replace(old_active,new_active,1)

          old_sethover="""  function setHover(key,on,source){
    const it=items.get(key);if(!it)return;
    if(source==='label')it.labelHover=on;else if(source==='card')it.cardHover=on;else it.hover=on;
    refreshItem(it);
  }"""
          new_sethover="""  function setHover(key,on,source){
    const it=items.get(key);if(!it)return;
    if(source==='label')it.labelHover=on;else if(source==='card')it.cardHover=on;else it.hover=on;
    /* Parent-room state can depend on a child POI, so refresh the complete set. */
    refreshAll();
  }"""
          if old_sethover not in s:
              raise SystemExit('setHover not found')
          s=s.replace(old_sethover,new_sethover,1)

          old_hit="""    function hit(e){
      const r=rendererCanvas.getBoundingClientRect();
      pt.x=((e.clientX-r.left)/r.width)*2-1;pt.y=-((e.clientY-r.top)/r.height)*2+1;
      ray.setFromCamera(pt,camera3);
      const targets=[...items.values()].map(i=>i.detect).filter(Boolean);
      const hs=ray.intersectObjects(targets,false);
      return hs.length?hs[0].object.userData.r616Key:null;
    }"""
          new_hit="""    function hit(e){
      const r=rendererCanvas.getBoundingClientRect();
      pt.x=((e.clientX-r.left)/r.width)*2-1;pt.y=-((e.clientY-r.top)/r.height)*2+1;
      ray.setFromCamera(pt,camera3);
      /* POIs deliberately win over a surrounding room volume. */
      const poiTargets=[...items.values()].filter(i=>i.type==='poi').map(i=>i.detect).filter(Boolean);
      let hs=ray.intersectObjects(poiTargets,false);
      if(hs.length)return hs[0].object.userData.r616Key;
      const roomTargets=[...items.values()].filter(i=>i.type==='room').map(i=>i.detect).filter(Boolean);
      hs=ray.intersectObjects(roomTargets,false);
      return hs.length?hs[0].object.userData.r616Key:null;
    }"""
          if old_hit not in s:
              raise SystemExit('hit function not found')
          s=s.replace(old_hit,new_hit,1)

          old_radius="""    const hit=new THREE.Mesh(new THREE.SphereGeometry(radius*3.5,12,8),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthTest:false,depthWrite:false,colorWrite:false}));"""
          new_radius="""    const hit=new THREE.Mesh(new THREE.SphereGeometry(radius*5.0,14,10),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthTest:false,depthWrite:false,colorWrite:false}));"""
          if old_radius not in s:
              raise SystemExit('POI hit sphere not found')
          s=s.replace(old_radius,new_radius,1)

          p.write_text(s,encoding='utf-8')

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-hotspot-map-and-poi-priority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add room-hotspot.js .github/workflows/fix-hotspot-map-and-poi-priority.yml
          git commit -m "Correct hotspot axis mapping and prioritize POIs"
          git push
