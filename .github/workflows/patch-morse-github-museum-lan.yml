name: Patch Morse GitHub museum LAN mode

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_morse_github_museum_lan.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Morse page
        run: python scripts/patch_morse_github_museum_lan.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morse.html morse_BACKUP_2026-08-23_1245.html
          git diff --cached --quiet || git commit -m "Enable museum taster from GitHub web dashboard"
          git push
