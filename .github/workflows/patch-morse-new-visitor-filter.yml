name: Patch Morse visitor reset and filter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-morse-new-visitor-filter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Morse page
        run: python scripts/patch_morse_new_visitor_filter.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morse.html morse_BACKUP_*.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Reset Morse levels per visitor and filter Level 1 input"
            git push
          fi
