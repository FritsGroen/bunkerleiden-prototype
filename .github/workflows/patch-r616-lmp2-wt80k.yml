name: Patch R616 rooms and techniek dossiers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-r616-lmp2-wt80k.yml'
      - '.github/scripts/patch_r616_lmp2_wt80k.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python .github/scripts/patch_r616_lmp2_wt80k.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add R616 rooms and LMP2/WT80K techniek dossiers"
          git push
