name: Patch Morse public to museum redirect

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_morse_public_to_museum_redirect.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Morse public redirect
        run: python scripts/patch_morse_public_to_museum_redirect.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morse.html morse_BACKUP_2026-08-23_1311.html
          git diff --cached --quiet || git commit -m "Redirect public real-key button to museum mode"
          git push
