name: Patch mobile home map first

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-mobile-home-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup current index
        run: cp index.html index_BACKUP_2026-08-19_1035.html
      - name: Patch map, Haarlemmerweg marker and mobile tabs
        run: python scripts/patch-map-haarlemmer-tabs.py
      - name: Commit website update
        run: |
          if git diff --quiet && git status --porcelain | grep -q '^'; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index_BACKUP_2026-08-19_1035.html
          git commit -m "Center map, add Haarlemmerweg marker and mobile tab focus"
          git push
