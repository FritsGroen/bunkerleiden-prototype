name: Patch mobile home map first

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-mobile-home-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile homepage layout
        run: python scripts/patch_mobile_home_map.py
      - name: Commit website update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show homepage map first on mobile"
          git push
