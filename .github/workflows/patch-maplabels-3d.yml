name: Patch map labels and 3D viewer

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    if: github.event_name == 'issues' && github.event.issue.title == 'trigger-maplabels-3d-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''<div class="targetlabel mw"><b>A · R616 MORSWEG</b>GROSSSCHALTSTELLE</div><div class="targetlabel bm"><b>B · BOOMMARKT</b>TELEFOONBUNKER</div></div><div class="targetbar">'''
          new = '''</div><div class="targetlabel mw maplabel" id="labelMW"><b>A · R616 MORSWEG</b>GROSSSCHALTSTELLE</div><div class="targetlabel bm maplabel" id="labelBM"><b>B · BOOMMARKT</b>TELEFOONBUNKER</div><div class="targetbar">'''
          assert old in s, 'map labels HTML not found'
          s = s.replace(old, new, 1)

          old = '''.targetlabel{position:absolute;z-index:11;background:#070a07df;border-left:2px solid var(--a);padding:8px 10px;font:9px/1.35 monospace;pointer-events:none;transform:scale(var(--inv,1));transform-origin:left top}.targetlabel b{display:block;color:var(--a2)}.targetlabel.mw{left:33.4%;top:36.6%}.targetlabel.bm{left:41.5%;top:43.0%}'''
          new = '''.targetlabel{position:absolute;z-index:11;background:#070a07ee;border-left:2px solid var(--a);padding:8px 10px;font:9px/1.35 monospace;pointer-events:none}.targetlabel b{display:block;color:var(--a2)}.maplabel{transform:none!important;will-change:left,top;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;backdrop-filter:blur(2px)}'''
          assert old in s, 'targetlabel CSS not found'
          s = s.replace(old, new, 1)

          old = '''function applyMap(){mapworld.style.setProperty('--inv',1/mapScale);mapworld.style.transform=`translate3d(${panX}px,${panY}px,0) scale(${mapScale})`}'''
          new = '''function positionMapLabels(){let w=mapworld.offsetWidth,h=mapworld.offsetHeight;if(!w||!h)return;let pts=[[labelMW,.334,.366],[labelBM,.415,.430]];for(let [el,x,y] of pts){if(!el)continue;el.style.left=Math.round(panX+x*w*mapScale)+'px';el.style.top=Math.round(panY+y*h*mapScale)+'px'}}\nfunction applyMap(){mapworld.style.setProperty('--inv',1/mapScale);mapworld.style.transform=`translate3d(${panX}px,${panY}px,0) scale(${mapScale})`;positionMapLabels()}'''
          assert old in s, 'applyMap not found'
          s = s.replace(old, new, 1)

          s = s.replace('Beweeg de muis over het model om het subtiel te draaien. Zoom met muiswiel of pinch. Het model zelf kan niet worden gewijzigd.', 'Sleep met de muis om vrij 360° rond het model te draaien. Zoom met muiswiel of pinch. Het model zelf kan niet worden gewijzigd.', 1)
          s = s.replace('HOVER = KIJKHOEK · MUISWIEL/PINCH = ZOOM · GEEN BEWERKING', 'SLEEP = 360° DRAAIEN · MUISWIEL/PINCH = ZOOM · GEEN BEWERKING', 1)
          oldnote = '''<div class="modelnote"><b>MODELUPDATE</b><br>De viewer laadt altijd <b>Assembly1.stl</b>. Een nieuwe versie kan dus later met exact dezelfde bestandsnaam worden vervangen zonder de websitecode aan te passen.</div>'''
          newnote = '''<div class="modelnote"><b>BRON & MODELUPDATE</b><br>Bron 3D-model: eigen digitale reconstructie voor Stichting Bunker Leiden · <b>Assembly1.stl</b> · model in ontwikkeling.<br><br>Een verbeterde versie kan later met exact dezelfde bestandsnaam worden vervangen zonder de websitecode aan te passen.</div>'''
          assert oldnote in s, 'model note not found'
          s = s.replace(oldnote, newnote, 1)

          old = '''let scene3,camera3,renderer3,controls3,mesh3,anim3,threeReady=false,targetRX=0,targetRY=0;'''
          new = '''let scene3,camera3,renderer3,controls3,mesh3,anim3,threeReady=false,key3,floor3;'''
          assert old in s, '3D vars not found'
          s = s.replace(old, new, 1)

          start = s.index('function init3D(){')
          end = s.index('function resize3D(){', start)
          assert start >= 0 and end > start, '3D function block not found'
          replacement = r'''function concreteTexture(){let c=document.createElement('canvas');c.width=c.height=512;let x=c.getContext('2d'),im=x.createImageData(512,512),d=im.data;for(let i=0;i<d.length;i+=4){let n=104+Math.random()*42;d[i]=n*1.03;d[i+1]=n;d[i+2]=n*.94;d[i+3]=255}x.putImageData(im,0,0);for(let i=0;i<180;i++){let px=Math.random()*512,py=Math.random()*512,r=2+Math.random()*18,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(30,28,24,'+(Math.random()*.13)+')');g.addColorStop(1,'rgba(30,28,24,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}let t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(5,5);t.anisotropy=Math.min(8,renderer3.capabilities.getMaxAnisotropy());t.encoding=THREE.sRGBEncoding;return t}
function init3D(){if(threeReady){resize3D();return}let canvas=document.getElementById('stlviewer'),wrap=document.getElementById('modelwrap');if(!canvas||!wrap)return;scene3=new THREE.Scene();camera3=new THREE.PerspectiveCamera(38,wrap.clientWidth/wrap.clientHeight,.1,100000);renderer3=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});renderer3.setPixelRatio(Math.min(devicePixelRatio,2));renderer3.setSize(wrap.clientWidth,wrap.clientHeight,false);renderer3.outputEncoding=THREE.sRGBEncoding;renderer3.shadowMap.enabled=true;renderer3.shadowMap.type=THREE.PCFSoftShadowMap;renderer3.toneMapping=THREE.ACESFilmicToneMapping;renderer3.toneMappingExposure=.95;scene3.add(new THREE.HemisphereLight(0xc9d0c2,0x171a15,.72));key3=new THREE.DirectionalLight(0xffe2b2,2.15);key3.castShadow=true;key3.shadow.mapSize.set(2048,2048);scene3.add(key3);let fill=new THREE.DirectionalLight(0x9babc0,.38);fill.position.set(-2,1,-1);scene3.add(fill);let loader=new THREE.STLLoader();loader.load('Assembly1.stl',g=>showGeometry(g),undefined,e=>{modelload.innerHTML='STL KON NIET WORDEN GELADEN<br><span style="color:#9c947f;font-size:9px">CONTROLEER Assembly1.stl IN MAIN</span>'});controls3=new THREE.OrbitControls(camera3,canvas);controls3.enablePan=false;controls3.enableRotate=true;controls3.enableZoom=true;controls3.enableDamping=true;controls3.dampingFactor=.07;controls3.rotateSpeed=.62;controls3.zoomSpeed=.82;controls3.mouseButtons.LEFT=THREE.MOUSE.ROTATE;controls3.mouseButtons.MIDDLE=THREE.MOUSE.DOLLY;controls3.mouseButtons.RIGHT=THREE.MOUSE.ROTATE;controls3.touches.ONE=THREE.TOUCH.ROTATE;controls3.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;controls3.minPolarAngle=.08;controls3.maxPolarAngle=Math.PI-.08;controls3.minDistance=1;controls3.maxDistance=100000;threeReady=true;animate3D();window.addEventListener('resize',resize3D)}
function showGeometry(g){g.computeVertexNormals();g.computeBoundingBox();let c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,-c.z);g.computeBoundingBox();g.computeBoundingSphere();let rad=g.boundingSphere.radius,tex=concreteTexture();let mat=new THREE.MeshStandardMaterial({map:tex,bumpMap:tex,bumpScale:rad*.0012,color:0x89857c,roughness:.96,metalness:.015,side:THREE.DoubleSide});mesh3=new THREE.Mesh(g,mat);mesh3.castShadow=true;mesh3.receiveShadow=true;scene3.add(mesh3);let floorMat=new THREE.MeshStandardMaterial({color:0x171914,roughness:1,metalness:0});floor3=new THREE.Mesh(new THREE.PlaneGeometry(rad*7,rad*7),floorMat);floor3.rotation.x=-Math.PI/2;floor3.position.y=g.boundingBox.min.y-rad*.035;floor3.receiveShadow=true;scene3.add(floor3);key3.position.set(rad*2.3,rad*3.4,rad*2.1);key3.target=mesh3;key3.shadow.camera.left=-rad*2;key3.shadow.camera.right=rad*2;key3.shadow.camera.top=rad*2;key3.shadow.camera.bottom=-rad*2;key3.shadow.camera.near=rad*.05;key3.shadow.camera.far=rad*8;key3.shadow.bias=-.00015;key3.shadow.normalBias=rad*.00015;key3.shadow.camera.updateProjectionMatrix();camera3.position.set(rad*1.62,rad*.88,rad*1.72);camera3.near=Math.max(rad/1500,.05);camera3.far=rad*20;camera3.updateProjectionMatrix();controls3.target.set(0,0,0);controls3.minDistance=rad*.72;controls3.maxDistance=rad*4.5;controls3.update();modelload.style.display='none'}
function animate3D(){anim3=requestAnimationFrame(animate3D);if(controls3)controls3.update();if(renderer3)renderer3.render(scene3,camera3)}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve sharp map labels and 3D concrete viewer"
          git push
