name: Add FF33 Kurbel interaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-ff33-kurbel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch FF33 Kurbel interaction
        run: python scripts/add_ff33_kurbel_interaction.py
      - name: Commit website update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index_BACKUP_2026-08-19_1155.html
          git commit -m "Add hold-to-turn FF33 Kurbel interaction"
          git push
