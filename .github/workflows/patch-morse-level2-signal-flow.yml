name: Patch Morse Level 2 signal flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-morse-level2-signal-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Morse Level 2
        run: python scripts/patch_morse_level2_signal_flow.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morse.html morse_BACKUP_2026-08-23_1034.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Change Level 2 to Morse signal recognition"
            git push
          fi
