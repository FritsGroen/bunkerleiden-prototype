name: Add location C dossier card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-location-c-dossier-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add C dossier card
        run: python scripts/add_location_c_dossier_card.py
      - name: Commit website update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index_BACKUP_2026-08-22_1338.html
          git commit -m "Add Scheepswerf Boot to dossiers"
          git push
