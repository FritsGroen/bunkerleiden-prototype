name: Patch Morse Web Serial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-morse-webserial.yml'
      - 'scripts/patch_morse_webserial.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Morse dashboard
        run: python scripts/patch_morse_webserial.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morse.html morse_BACKUP_2026-08-23_1126.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add ESP32 physical key support to Morse dashboard"
            git push
          fi
