name: Add LMP2 animated GIF

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_lmp2_gif.py'
      - '.github/workflows/add-lmp2-gif.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch LMP2 dossier
        run: python scripts/add_lmp2_gif.py
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add animated LMP2 GIF to techniek dossier"
          git push
