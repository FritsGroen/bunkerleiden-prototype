name: Patch Morse mission link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-morse-mission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Morse mission to dashboard
        run: python scripts/patch_morse_mission_link.py
      - name: Commit website update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link Morse mission to interactive dashboard"
          git push
