name: Patch Morse Level 1 startup fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-morse-start-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_morse_start_fix.py
      - name: Commit patched Morse page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morse.html morse_BACKUP_2026-08-23_1050.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix Morse Level 1 startup after word filter"
            git push
          fi
