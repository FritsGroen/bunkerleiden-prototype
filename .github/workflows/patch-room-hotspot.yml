name: Patch 3D room hotspot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-room-hotspot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add room hotspot module to index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="room-hotspot.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-room-hotspot.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-room-hotspot.yml
          git diff --cached --quiet && exit 0
          git commit -m "Enable pilot 3D Schakelruimte hotspot"
          git push
