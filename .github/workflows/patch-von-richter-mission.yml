name: Patch Von Richter mission video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-von-richter-mission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch mission card
        run: python scripts/patch_von_richter_mission_video.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index_BACKUP_2026-08-23_1114.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Von Richter video to incoming call mission"
            git push
          fi
